name: Build Kamal File Manager APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Fix android-37 platform path
        # android-37.0 is installed but AGP expects android-37 AND package.xml must match.
        # Symlink alone isn't enough — AGP validates package.xml path attribute too.
        run: |
          PLATFORMS="$ANDROID_HOME/platforms"
          if [ -d "$PLATFORMS/android-37.0" ] && [ ! -d "$PLATFORMS/android-37" ]; then
            sudo cp -r "$PLATFORMS/android-37.0" "$PLATFORMS/android-37"
            sudo sed -i 's/platforms;android-37\.0/platforms;android-37/g' "$PLATFORMS/android-37/package.xml"
            echo "Copied android-37.0 to android-37 and patched package.xml"
          fi

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.log; exit ${PIPESTATUS[0]}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-output.log

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KamalFileManager-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
