name: Build Kamal File Manager APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Fix android-37 platform path
        # The runner ships android-37.0 but AGP looks for android-37 (no minor version).
        # Create symlink so Gradle finds the already-installed platform.
        run: |
          PLATFORMS="$ANDROID_HOME/platforms"
          echo "Installed platforms:"
          ls "$PLATFORMS/"
          if [ -d "$PLATFORMS/android-37.0" ] && [ ! -d "$PLATFORMS/android-37" ]; then
            sudo ln -s "$PLATFORMS/android-37.0" "$PLATFORMS/android-37"
            echo "Symlink created: android-37 -> android-37.0"
          fi

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.log; exit ${PIPESTATUS[0]}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-output.log

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KamalFileManager-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
